name: AEOS CodENavi Registry Migration

on:
  push:
    branches:
      - refactor/single-codenavi-agent-image-standard

permissions:
  contents: write

jobs:
  canonicalize-registry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/single-codenavi-agent-image-standard
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Canonicalize skill ownership
        run: node scripts/aeos-canonicalize-skill-registry.mjs

      - name: Commit canonical registry when changed
        shell: bash
        run: |
          if git diff --quiet -- aeos/registries/skills.registry.yaml; then
            echo "Registry already canonical."
            exit 0
          fi
          git config user.name "aeos-codenavi-migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aeos/registries/skills.registry.yaml
          git commit -m "refactor(aeos): canonicalize base skill ownership"
          git push origin HEAD:refactor/single-codenavi-agent-image-standard
