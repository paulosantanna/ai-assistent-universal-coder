name: Pre-push security gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepush:
    name: CVE, libraries, language, executables, SAST and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Contract tests
        run: python -m unittest discover -s quality/prepush/tests -v
      - name: Live gate
        run: python quality/prepush/prepush.py --repo .
