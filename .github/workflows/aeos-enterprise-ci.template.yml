name: AEOS Enterprise CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: capability-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aeos-quality-gates:
    name: Skills, MCPs, LSPs and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install pinned YAML parser
        run: python -m pip install --require-hashes -r quality/requirements.txt
      - name: Validator adversarial contract tests
        run: python -m unittest discover -s quality/tests -v
      - name: Validate all capabilities and distribution
        run: python quality/validate.py --runtime
      - name: Capability summary
        if: always()
        shell: bash
        run: |
          if test -f .aeos/quality/summary.md; then
            cat .aeos/quality/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Evidence for this commit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: capability-quality-${{ github.sha }}-${{ github.run_id }}
          path: .aeos/quality/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
