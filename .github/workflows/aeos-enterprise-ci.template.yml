name: AEOS Enterprise CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: write
  actions: read

jobs:
  aeos-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AEOS_TMP: /tmp/aeos-tmp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Refresh root lockfile for dependency maintenance
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/codenavi-continuity-standard'
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "Root lockfile already current."
          else
            git config user.name "aeos-dependency-maintenance"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): refresh root lockfile overrides"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Install Node dependencies
        run: npm run aeos:bootstrap:deps

      - name: AEOS Node-only verification suite
        run: npm run aeos:verify:full

      - name: Upload AEOS evidence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aeos-evidence
          path: |
            .aeos/evidence/**
            .aeos/reports/**
            .aeos/derived/registries/**
          if-no-files-found: ignore
