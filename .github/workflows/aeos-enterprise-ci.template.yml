name: AEOS Enterprise CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read
  actions: read

jobs:
  aeos-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AEOS_TMP: /tmp/aeos-tmp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm run aeos:bootstrap:deps

      - name: AEOS Node-only verification suite
        run: npm run aeos:verify:full

      - name: Upload AEOS evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeos-evidence
          path: |
            .aeos/evidence/**
            .aeos/reports/**
            .aeos/derived/registries/**
          if-no-files-found: warn
