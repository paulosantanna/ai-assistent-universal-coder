[project]
name = "rag-graph-laya-mcp"
version = "0.1.0"
description = "Local-first, source-backed GraphRAG and Laya MCP of codenavi-agent"
requires-python = ">=3.15"
dependencies = [
  "mcp==2.3.0",
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "pypdf==7.1.1",
  "graphiti-core==0.32.1",
]

[project.optional-dependencies]
training = [
  "laya==0.5.4",
  "torch==2.15.0",
  "transformers==5.24.1",
  "trl==1.19.0",
  "peft==0.22.0",
  "bitsandbytes==0.50.2",
  "datasets==5.2.0",
  "accelerate==1.16.0",
  "sentence-transformers==6.3.0",
  "psutil==7.2.2",
]
test = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "ruff==0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false
