knowledge_domain: kinghost-control
version: "2026-09-16.2"
policy:
  authority_order: [official_vendor_docs, official_vendor_video, wordpress_official_docs, first_party_engineering]
  require_source_url: true
  reject_undocumented_capabilities: true
  refresh_before_high_risk_action: true
  video_claims_require_doc_corroboration_for_mutation: true

