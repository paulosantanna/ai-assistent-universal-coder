  kinghost_youtube:
    authority: official_vendor_video
    channel: https://www.youtube.com/@kinghost
    ingestion_policy:
      - process only public official-channel videos relevant to hosting operations
      - preserve title video_id publication date and source URL
      - use aura-voice transcript/evidence semantics when an official transcript or authorized media input is available
      - do not promote a video-only operational claim to mutation authority until corroborated by current official KingHost documentation or the live panel
      - promotional content may enrich terminology but cannot define executable behavior
