  - Findings, verdicts and patch claims cite evidence
  - Snapshot and state-root boundaries are preserved when applicable
  - Generated code, reproducers and patches are sandboxed when executed
  - Secrets and sensitive data are redacted
  stop_conditions:
  - Required authorization, target scope or Mantis state is missing
  - Snapshot, provenance, schema or sentinel checks fail
  - Required sandboxing or approval is unavailable
  - Evidence cannot be produced
  - Original Mantis contract or honest evaluator returns a blocker
