  path: skills/simulator-ai/SKILL.md
  version: 1.0.0
  owner_agent: architect
  risk_level: critical
  capabilities:
  - READ_REPOSITORY
  - READ_FILES
  - GENERATE_REPORT
  - GENERATE_PATCH
  - DETECT_STACK
  mission: Design, build, validate and evolve AI-powered medical simulators for in-silico
    clinical trials. Integrates physiological models (Hovorka, UVA/Padova), virtual
    patient populations, RL clinical optimizers, and clinical governance.
  allowed_actions:
  - Read authorized files through Tool Router
  - Design and implement physiological simulation models
  - Implement RL clinical policy optimizers
  - Create and manage virtual patient populations
  - Validate simulation outputs against physiological constraints
  - Generate trial protocol objects
  - Record lessons in knowledge/ and memory/
  forbidden_actions:
  - Direct filesystem access
  - Direct Git mutation
  - Secret value exposure
  - Claiming simulation results as clinical proof
  - Autonomous deployment of RL policies to real patients
  - Making unsupported claims about cures or clinical efficacy
  required_inputs:
  - simulation_objective
  - repository_path
  output_schema:
    type: object
    properties:
      simulation_engine:
        type: object
      virtual_population:
        type: array
      rl_optimizer:
        type: object
      trial_protocols:
        type: array
      validation_report:
        type: object
  quality_gates:
  - Physiological model passes unit tests
  - RL optimizer shows monotonic reward improvement
  - Simulation produces physiologically plausible outputs
  - No claims of cure or clinical proof are made
  - All limitations are disclosed
  - Safety constraints prevent unrealistically extreme outputs
  stop_conditions:
  - Scope must expand beyond simulation design
  - Simulation requires real patient data without governance
  - Clinical deployment requested without approval
  - Unsafe or unsupported claims detected
