skills:
  - id: social-media-operator
    path: skills/social-media-operator/SKILL.md
    version: 1.0.0
    owner_agent: codenavi-agent
    risk_level: medium
    capabilities:
      - SOCIAL_MEDIA_SESSION_CREATE
      - SOCIAL_MEDIA_SESSION_VALIDATE
      - SOCIAL_MEDIA_SESSION_LIST
      - SOCIAL_MEDIA_SESSION_CLOSE
      - TIKTOK_PROFILE_READ
      - TIKTOK_VIDEOS_LIST
      - INSTAGRAM_PROFILE_READ
      - INSTAGRAM_MEDIA_LIST
      - INSTAGRAM_INSIGHTS_READ
      - SOCIAL_MEDIA_AUTH_GUIDE
    mission: Governed TikTok and Instagram operations via browser-based authentication sessions. Sessions persist for 30 days or until platform cookies expire. No OAuth API keys required.
    required_mcps: [social-media, browser]
    allowed_secret_sources: [external_runtime_cookie_file_reference]
    quality_gates:
      - Session must validate before operations
      - All mutations require approved=true, change_id, rollback_ref
      - Visual verification via browser MCP for publishing
      - Cookie expiry respected - session dies when platform logs out
      - Max 30-day session lifetime regardless of cookie expiry
      - Cookies stored encrypted, never exposed to logs/evidence/notebook
      - Domain-scoped: TikTok cookies only work on *.tiktok.com
      - HTTPS only for all API requests
      - Automatic cleanup of expired sessions