skills:
  - id: not-your-babysitter
    path: skills/not-your-babysitter/SKILL.md
    version: 1.0.0
    owner_agent: codenavi-agent
    risk_level: high
    capabilities:
      - READ_REPOSITORY
      - READ_FILES
      - AUTONOMOUS_OPERATOR_MODE
    production_ready: true
    mission: Drive a task to a verified result with evidence-or-stop and minimal interruption.
    allowed_actions:
      - Execute locally against verified evidence
      - Write continuity notes
    forbidden_actions:
      - Create another agent identity
      - Guess or fake done
      - Push, deploy or change production data without explicit go-ahead
    required_inputs:
      - user_objective
    quality_gates:
      - Claims cite evidence from this run
    stop_conditions:
      - Destructive action without explicit go-ahead
      - Dead-end after exhausting sources
  - id: cursor-subagent-creator
