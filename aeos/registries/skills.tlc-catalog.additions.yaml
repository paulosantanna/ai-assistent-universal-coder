  - id: tlc-plan
    path: skills/tlc-plan/SKILL.md
    version: 0.2.0
    owner_agent: codenavi-agent
    risk_level: medium
    capabilities:
      - READ_REPOSITORY
      - READ_FILES
      - GENERATE_REPORT
      - DECIDED_SOURCE_TASK_CUT
    production_ready: true
    mission: Cut a decided PRD, design doc or ticket into grounded tasks with observable criteria.
    allowed_actions:
      - Read decided sources and the repository
      - Write .tasks artifacts
      - Amend a source that contradicts the code
    forbidden_actions:
      - Create another agent identity
      - Invent criteria nobody decided
      - Implement the tasks
      - Grow scope without the user
    required_inputs:
      - decided_source
    quality_gates:
      - Criteria are observable with concrete values
      - Surface walk and nine-dimension sweep have landings
    stop_conditions:
      - No decided source
      - User asked only to implement
  - id: learning-opportunities
    path: skills/learning-opportunities/SKILL.md
    version: 1.1.0
    owner_agent: codenavi-agent
    risk_level: low
    capabilities:
      - READ_REPOSITORY
      - GENERATE_REPORT
      - DELIBERATE_LEARNING_EXERCISE
    production_ready: true
    mission: Offer optional short exercises after architectural work so the user practices the change.
    allowed_actions:
      - Ask once to run an optional exercise
      - Point the user at repository files
    forbidden_actions:
      - Create another agent identity
      - Continue generating after posing a question
      - Promote unverified exercise text into LEARNING.md
    required_inputs:
      - user_objective
    quality_gates:
      - Offer is optional and one sentence
      - Pause after each question
    stop_conditions:
      - User declined or signaled urgency
      - Two exercises already completed this session
