skills:
  - id: kinghost-expert
    path: skills/kinghost-expert/SKILL.md
    version: 1.3.0
    owner_agent: codenavi-agent
    risk_level: high
    capabilities:
      - KINGHOST_ENVIRONMENT
      - KINGHOST_DOMAIN_SELECT
      - KINGHOST_DOMAIN_DNS_SSL
      - KINGHOST_CREDENTIAL_BIND
      - KINGHOST_COOKIE_PANEL
      - KINGHOST_SITE_CLONE
      - KINGHOST_FTP_PUBLISH
      - KINGHOST_GIT_PUBLISH
      - KINGHOST_PHP_CONFIG
      - KINGHOST_MYSQL
      - KINGHOST_BACKUP_RECOVERY
      - KINGHOST_EMAIL_OPERATIONS
      - KINGHOST_ANTIVIRUS_WAF
      - KINGHOST_CACHE_PERFORMANCE
      - WORDPRESS_PRODUCTION_OPERATIONS
      - WORDPRESS_WOOCOMMERCE
      - ROLLBACK_PLANNING
    mission: Complete governed KingHost Hospedagem control from panel authentication through domains/DNS/SSL, FTP/Git/WordPress/PHP/MySQL, backup/recovery, email, antivirus/WAF, performance and production verification.
    required_mcps: [kinghost-control, wordpress-knowledge, browser]
    allowed_secret_sources: [external_runtime_cookie_file_reference, env_reference, secret_reference]
    quality_gates:
      - Production FSM states advance in order for code/data publish
      - Credentials remain opaque refs
      - Current KingHost docs or live panel corroborate mutable video-derived knowledge
      - WordPress core and wp-config.php are not uploaded without high-risk approval
      - High-impact mutation has inventory, rollback and post-change verification
      - Cookie/Playwright/mailbox/database secrets never persist

