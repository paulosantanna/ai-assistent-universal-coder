      - ANALYZE_CODE
      - PROPOSE_PATCH
      - GENERATE_DIFF
    delegation_policy:
      allowed:
        coder:
          can_delegate_to: []
    output_schema:
      type: object
      properties:
        summary: { type: string }
        evidence_refs: { type: array, items: { type: string } }
