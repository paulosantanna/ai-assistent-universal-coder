agents:
  - id: root
    path: aeos/agents/root.agent.md
    role: root
    responsibilities:
      - Coordinate playbook execution
      - Delegate tasks to appropriate agents
      - Block premature completion
      - Ensure evidence generation
    allowed_actions:
      - delegate
      - monitor_execution
      - generate_report
      - block_execution
      - approve_delegation
    forbidden_actions:
      - execute tools directly
      - bypass Judge
      - expose secrets
      - access tools directly
    capabilities:
      - DELEGATE
      - MONITOR
      - REPORT
      - BLOCK
      - APPROVE
    delegation_policy:
      allowed:
        root:
          can_delegate_to:
            - planner
            - architect
            - coder
            - tester
            - security
            - documenter
            - devops
            - judge
    output_schema:
      type: object
      properties:
        summary: { type: string }
        evidence_refs: { type: array, items: { type: string } }
        risks: { type: array, items: { type: string } }
        blocking_conditions: { type: array, items: { type: string } }
        next_actions: { type: array, items: { type: string } }
    stop_conditions:
      - Evidence missing
      - Permission denied
      - Policy blocked
      - Secret exposure detected
      - Judge failure

  - id: planner
    path: aeos/agents/planner.agent.md
    role: planner
    responsibilities:
      - Convert playbook objectives into task graphs
      - Define dependencies and required evidence
      - Set delegation boundaries
      - Generate execution plans
    allowed_actions:
      - build_task_graph
      - assign_skills
      - define_dependencies
      - generate_delegation_plan
    forbidden_actions:
      - execute tools directly
      - approve actions
      - judge results
      - grant capabilities
      - expand scope without Root approval
    capabilities:
      - PLAN
      - GRAPH
      - DELEGATE
      - SCHEDULE
    delegation_policy:
      allowed:
        planner:
          can_delegate_to:
            - architect
            - coder
            - tester
            - security
    output_schema:
      type: object
      properties:
        task_graph: { type: object }
        risk_summary: { type: string }
        context_map: { type: object }
        delegation_plan: { type: object }
    stop_conditions:
      - Missing objective
      - Invalid dependency
      - Scope exceeds boundary

  - id: architect
    path: aeos/agents/architect.agent.md
    role: architect
    responsibilities:
      - Map repository architecture
      - Detect design patterns
      - Preserve design constraints
      - Generate architecture reports
    allowed_actions:
      - read_files
      - analyze_structure
      - detect_patterns
      - generate_architecture_report
    forbidden_actions:
      - execute tools directly
      - bypass Judge
      - expose secrets
      - mutate code directly
    capabilities:
      - READ_REPOSITORY
      - MAP_ARCHITECTURE
      - ANALYZE_PATTERNS
      - GENERATE_REPORT
    delegation_policy:
      allowed:
        architect:
          can_delegate_to: []
    output_schema:
      type: object
      properties:
        summary: { type: string }
        evidence_refs: { type: array, items: { type: string } }
        risks: { type: array, items: { type: string } }
        blocking_conditions: { type: array, items: { type: string } }
        next_actions: { type: array, items: { type: string } }
    stop_conditions:
      - Architecture not detected
      - Evidence missing

  - id: coder
    path: aeos/agents/coder.agent.md
    role: coder
    responsibilities:
      - Analyze code for improvements
      - Propose controlled patches
      - Generate code changes in sandbox
    allowed_actions:
      - read_files
      - analyze_code
      - propose_patch
      - generate_diff
    forbidden_actions:
      - execute tools directly
      - bypass Judge
      - expose secrets
      - mutate code outside sandbox
    capabilities:
