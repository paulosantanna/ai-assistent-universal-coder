permissions:
  default_policy: deny-all

  agent_to_mcp:
    - agent: codenavi-agent
      mcps: ["*"]
      allow: true

  agent_to_skill:
    - agent: codenavi-agent
      skills: ["*"]
      allow: true

  escalation_rules:
    - when: risk_level=critical
      then: human-approval+judge+rollback
    - when: destructive_action=true
      then: human-approval+judge+rollback
    - when: production_mutation=true
      then: human-approval+judge+rollback
    - when: secret_access=true
      then: runtime-only+masked+non-persistent
