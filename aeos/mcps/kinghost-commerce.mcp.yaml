mcp:
  id: kinghost-commerce
  name: KingHost Commerce Operations MCP
  protocol: model-context-protocol
  version: "2026-09-08"

  transport:
    type: stdio
    command: node
    args: ["kinghost-commerce-mcp/index.mjs"]
    persistent: true
    framing: jsonl

  capabilities:
    tools:
      - {name: kinghost.health, description: "Check adapter health and active session count.", security: read-only}
      - {name: kinghost.session.open_ssh, description: "Open authorized ephemeral SSH/SFTP session using runtime credentials.", security: credentialed}
      - {name: kinghost.session.open_mysql, description: "Open authorized ephemeral MySQL session using runtime credentials.", security: credentialed}
      - {name: kinghost.session.open_postgres, description: "Open authorized ephemeral PostgreSQL session using runtime credentials.", security: credentialed}
      - {name: kinghost.session.info, description: "Return redacted metadata for an opaque session reference.", security: read-only}
      - {name: kinghost.session.close, description: "Close an opaque session and erase runtime credential-bearing state.", security: read-only}
      - {name: kinghost.fs.list, description: "List remote files/directories through SFTP.", security: read-only}
      - {name: kinghost.fs.read, description: "Read bounded remote file content through SFTP.", security: read-only}
      - {name: kinghost.fs.write, description: "Write an approved, rollback-bound remote file change.", security: write-controlled}
      - {name: kinghost.fs.mkdir, description: "Create an approved remote directory.", security: write-controlled}
      - {name: kinghost.fs.rename, description: "Rename an approved remote path with rollback reference.", security: write-controlled}
      - {name: kinghost.fs.delete, description: "Delete an approved scoped remote file with rollback reference.", security: destructive-controlled}
      - {name: kinghost.ssh.exec_readonly, description: "Execute a strict allowlist of non-mutating diagnostic commands.", security: read-only}
      - {name: kinghost.db.query_readonly, description: "Execute bounded SELECT/SHOW/DESCRIBE/EXPLAIN database queries.", security: read-only}
      - {name: kinghost.db.query_mutation, description: "Execute approved database mutations after dry-run/change/rollback gates.", security: destructive-controlled}
      - {name: kinghost.access.request_plan, description: "Plan authorized KingHost access using runtime credentials or secret references without credential discovery.", security: read-only}
      - {name: kinghost.admin.super_plan, description: "Build an end-to-end governed KingHost administration plan across access, inventory, change, verification and rollback.", security: read-only}
      - {name: kinghost.cdc.workspace_plan, description: "Plan CDC-style change-diff-control between workspace artifacts and remote KingHost state.", security: read-only}
      - {name: kinghost.knowledge_search, description: "Search governed KingHost knowledge and official documentation.", security: read-only}
      - {name: kinghost.inspect_environment, description: "Inventory hosting plan, runtime, domains, databases, DNS, SSL, application stack and resource constraints.", security: read-only}
      - {name: kinghost.performance_audit, description: "Analyze CPU time, memory, HTTP errors, cacheability, database hotspots, static assets and application bottlenecks.", security: read-only}
      - {name: kinghost.deploy_plan, description: "Produce a rollback-aware deployment plan for FTP, SSH or Git based publication.", security: read-only}
      - {name: kinghost.database_plan, description: "Produce safe SQL/query/index/schema optimization plans with explain-first behavior.", security: read-only}
      - {name: kinghost.dns_plan, description: "Produce DNS change plans for A, AAAA, CNAME, TXT, MX and SRV records.", security: read-only}
      - {name: commerce.catalog_plan, description: "Build normalized product, SKU, pricing, inventory and taxonomy plans for B2B/B2C channels.", security: read-only}
      - {name: commerce.channel_mapping, description: "Map local catalog and order models to marketplace/social/delivery channel contracts.", security: read-only}
      - {name: commerce.price_sync_plan, description: "Calculate channel-aware price synchronization plans including fees, floors and margins.", security: read-only}
      - {name: commerce.logistics_plan, description: "Build stock, fulfillment, SLA, shipping and delivery synchronization plans.", security: read-only}
      - {name: web.modernization_plan, description: "Plan safe modernization for JavaScript, TypeScript, Node.js, React, Angular, CSS, PHP and static assets.", security: read-only}
      - {name: web.performance_budget, description: "Create Core Web Vitals, backend latency, query, cache and asset performance budgets.", security: read-only}

  security:
    allowed_domains:
      - "king.host"
      - "*.king.host"
      - "developers.facebook.com"
      - "business.instagram.com"
      - "developers.tiktok.com"
      - "developers.mercadolivre.com.br"
      - "developer-docs.amazon.com"
      - "developer.amazonservices.com"
      - "developers.shopee.com"
      - "developer.ifood.com.br"
      - "developer.uber.com"
      - "developer.99app.com"
      - "developer.mozilla.org"
      - "nodejs.org"
      - "react.dev"
      - "angular.dev"
      - "web.dev"
      - "owasp.org"
    blocked_domains:
      - "localhost"
      - "127.0.0.1"
      - "10.*"
      - "172.16.*"
      - "192.168.*"
    credentials:
      storage: forbidden
      logging: forbidden
      plaintext: ephemeral-runtime-only
      session_reference: opaque
      ttl_minutes: 15
    mutation:
      production_write_default: false
      database_write_default: false
      dns_write_default: false
      deploy_default: false
      catalog_publish_default: false
      approval_required_for_write: true
      dry_run_required: true
      rollback_required: true
      change_id_required: true
    audit:
      evidence_required: true
      log_tool_calls: true
      redact_secrets: true

  knowledge:
    source_registry: aeos/knowledge/kinghost-commerce.sources.yaml
    freshness_policy: aeos/policies/kinghost-commerce-freshness.policy.md
    primary_authority: official-documentation
    stale_after_days: 30
    refresh_before_mutation: true

prompt_contract:
  objective: "Understand and operate authorized KingHost-hosted commerce systems through evidence-first, reversible and least-privilege execution."
  evidence_required: true
  redact_outputs: true
  rules:
    - "Credentials are runtime-only and must never enter Git, evidence, memory or reports."
    - "Prefer official vendor documentation over blogs, forums or generated summaries."
    - "Never infer an API or endpoint that is not documented."
    - "Never extract, discover, scrape or persist credentials; access must be supplied as ephemeral runtime input or an approved secret reference."
    - "Inspect actual hosting/runtime constraints before recommending architecture."
    - "Use CDC as change-diff-control: capture evidence, compare, dry-run, apply approved scoped changes, then verify."
    - "Use EXPLAIN/analysis before database optimization."
    - "Require approved=true, change_id and rollback_ref for mutating operations."
    - "Require backup, health check and rollback evidence before deployment."
  stop_conditions:
    - "required source is stale or unverifiable"
    - "credentials would need durable storage"
    - "credential discovery, cookie extraction or session dumping is requested"
    - "host identity cannot be validated"
    - "requested action exceeds MCP capability scope"
    - "production mutation lacks approval, dry-run/change tracking or rollback"