mcp:
  id: rag-node
  name: RAG Node.js MCP
  protocol: model-context-protocol
  version: "1.0.0"

  transport:
    type: stdio
    command: node
    args: ["aeos/mcp-servers/rag-node-mcp.mjs"]
    persistent: true
    framing: jsonl

  capabilities:
    tools:
      - name: rag_node.health
        security: read-only
        description: Verify RAG Node MCP status, chunk defaults and offline retrieval mode.
      - name: rag_node.curriculum
        security: read-only
        description: Return the absorbed public TLC RAG-com-Node.js curriculum outline and its mapping to MCP tools.
      - name: rag_node.ingest
        security: workspace-write
        description: Chunk authorized in-memory documents with provenance and stable chunk IDs.
      - name: rag_node.search
        security: read-only
        description: Hybrid lexical plus TF-IDF cosine retrieval over ingested chunks with citations.
      - name: rag_node.chat
        security: read-only
        description: Grounded extractive answer packing over retrieved chunks with refusal when support is weak.
      - name: rag_node.express_plan
        security: read-only
        description: Return the governed Express plus SSE API plan mirroring the TLC development lessons.

  dependencies:
    required:
      - node>=18
    environment: []

  security:
    network_access: false
    shell_access: false
    workspace_only: true
    secrets_logging: forbidden
    evidence_required: true
    redaction_required: true

  knowledge:
    public_curriculum_source: https://www.techleads.club/c/rag-com-node-js
    curriculum_scope: public-outline-only
    video_transcript_policy: user-supplied-authorized-media-only
    primary_authority: tlc-public-curriculum-outline
    secondary_authority: open-node-rag-standards
    stale_after_days: 90
    video_mutation_policy: corroborate-with-user-supplied-transcript

prompt_contract:
  objective: "Implement the TLC RAG-com-Node.js pipeline as governed offline tools: ingest, chunk, retrieve, ground answers and expose an Express plus SSE plan."
  evidence_required: true
  redact_outputs: true
  rules:
    - "Operate only on caller-supplied authorized documents; never scrape gated TLC video content."
    - "Full lesson transcripts require user-supplied authorized media processed through voiceai or aura-voice; without it, answer from the public outline only."
    - "Preserve TLC technical nomenclature exactly (vetorização, busca vetorial, chunks, Express, Server-Sent Events) alongside Node.js, TypeScript and API terms."
    - "Refuse grounded answers when the top retrieval score is weak instead of hallucinating."
    - "Return stable chunk IDs, scores and citation refs for every retrieval and chat result."
    - "Route access through AEOS MCP runtime and Tool Router policy checks."
  stop_conditions:
    - "requested capability is outside the declared RAG Node tool scope"
    - "ingest payload is missing, empty or exceeds the bounded document limit"
    - "retrieval corpus is empty for search or chat"
    - "grounding support is too weak and refusal is the correct answer"
    - "output cannot be redacted safely"
