mcp:
  id: kinghost-control
  name: KingHost Deterministic Control MCP
  protocol: model-context-protocol
  version: "1.3.0"

  transport:
    type: stdio
    command: node
    args: ["kinghost-control-mcp/index.mjs"]
    persistent: true
    framing: jsonl

  capabilities:
    tools:
      - { name: kinghost_control.health, security: read-only }
      - { name: kinghost_control.environment.catalog, security: read-only }
      - { name: kinghost_control.environment.select, security: read-only }
      - { name: kinghost_control.plugin.catalog, security: read-only }
      - { name: kinghost_control.credential.bind, security: credentialed }
      - { name: kinghost_control.credential.info, security: read-only }
      - { name: kinghost_control.credential.close, security: read-only }
      - { name: kinghost_control.fsm.state, security: read-only }
      - { name: kinghost_control.fsm.advance, security: write-controlled }
      - { name: kinghost_control.wordpress.inventory_plan, security: read-only }
      - { name: kinghost_control.wordpress.change_plan, security: read-only }
      - { name: kinghost_control.php.config_plan, security: read-only }
      - { name: kinghost_control.mysql.plan_readonly, security: read-only }
      - { name: kinghost_control.mysql.plan_mutation, security: read-only }
      - { name: kinghost_control.mysql.session.open, security: credentialed }
      - { name: kinghost_control.mysql.query_readonly, security: read-only }
      - { name: kinghost_control.mysql.query_mutation, security: destructive-controlled }
      - { name: kinghost_control.ftp.session.open, security: credentialed }
      - { name: kinghost_control.ftp.list, security: read-only }
      - { name: kinghost_control.ftp.read, security: read-only }
      - { name: kinghost_control.ftp.upload, security: write-controlled }
      - { name: kinghost_control.ftp.mkdir, security: write-controlled }
      - { name: kinghost_control.ftp.delete, security: destructive-controlled }
      - { name: kinghost_control.session.close, security: read-only }
      - { name: kinghost_control.panel.auth_plan, security: read-only }
      - { name: kinghost_control.panel.session.open_cookie_file, security: credentialed }
      - { name: kinghost_control.panel.session.info, security: read-only }
      - { name: kinghost_control.panel.fetch_readonly, security: read-only }
      - { name: kinghost_control.domain.list, security: read-only }
      - { name: kinghost_control.domain.select, security: read-only }
      - { name: kinghost_control.users.list, security: read-only }
      - { name: kinghost_control.wordpress.users.list, security: read-only }
      - { name: kinghost_control.wordpress.plugins.inventory, security: read-only }
      - { name: kinghost_control.ftp.tree.list, security: read-only }
      - { name: kinghost_control.ftp.tree.download, security: read-only }
      - { name: kinghost_control.ftp.tree.upload, security: write-controlled }
      - { name: kinghost_control.site.clone, security: read-only }
      - { name: kinghost_control.mysql.wordpress.inventory, security: read-only }
      - { name: kinghost_control.backup.plan, security: read-only }
      - { name: kinghost_control.rollback.plan, security: read-only }
      - { name: kinghost_control.verify.smoke_plan, security: read-only }
      - { name: kinghost_control.deploy.workspace_to_production, security: write-controlled }
      - { name: kinghost_control.publish.preflight, security: read-only }
      - { name: kinghost_control.knowledge_search, security: read-only }

  security:
    allowed_domains:
      - "king.host"
      - "*.king.host"
      - "painel.kinghost.com.br"
      - "*.kinghost.com.br"
      - "*.kinghost.net"
      - "developer.wordpress.org"
      - "wordpress.org"
    credentials:
      storage: forbidden
      logging: forbidden
      plaintext: ephemeral-runtime-only
      session_reference: opaque
      ttl_minutes: 15
      bind_sources: [env_reference, secret_reference, runtime_memory, cookie_session_panel]
    mutation:
      production_write_default: false
      database_write_default: false
      deploy_default: false
      approval_required_for_write: true
      dry_run_required: true
      rollback_required: true
      change_id_required: true
    audit:
      evidence_required: true
      log_tool_calls: true
      redact_secrets: true

  knowledge:
    source_registry: aeos/knowledge/kinghost-control.sources.yaml
    freshness_policy: aeos/policies/kinghost-commerce-freshness.policy.md
    primary_authority: official-documentation
    secondary_authority: official-kinghost-youtube
    stale_after_days: 30
    video_mutation_policy: corroborate-with-current-docs-or-live-panel

prompt_contract:
  objective: "Operate KingHost Hospedagem end to end: panel authentication, domains/DNS/SSL, FTP/Git/WordPress/PHP/MySQL, backup/recovery, email, antivirus/WAF, cache/performance and production-safe publish without leaking secrets or inventing private APIs."
  evidence_required: true
  redact_outputs: true
  rules:
    - "Bind already-created login/password material from env, secret references, runtime memory or a cookie-authenticated panel session. Never scrape, brute-force or persist secrets."
    - "Open the KingHost panel with an external workspace cookie-jar via panel.session.open_cookie_file. Return panel_session_ref only."
    - "List and select the exact hosting domain/environment before inventory or mutation."
    - "Use kinghost_control.knowledge_search before material hosting operations and refresh current official documentation for high-risk actions."
    - "Official @kinghost videos are educational evidence; mutable behavior learned from video must be corroborated by current KingHost documentation or the live panel."
    - "For panel-only controls (DNS, SSL, backup request, antivirus, WAF, email, Varnish/performance, Git integration), use governed browser/Playwright against documented UI rather than undocumented private endpoints."
    - "Return credential_ref/session_ref, usernames and redacted host only. Never return passwords, hashes, cookies, mailbox secrets or unmasked sensitive data."
    - "Production FTP/MySQL writes require approved=true, change_id, dry-run and rollback_ref."
    - "Do not edit WordPress core or wp-config.php without high_risk_approved."
    - "Antivirus quarantine, WAF, cache and restore actions require post-change application verification; a panel success message is not PASS."
    - "DNS writes require prior record snapshot and rollback; database restore requires current-state snapshot."
  stop_conditions:
    - "credential discovery or password dump requested"
    - "environment or domain identity is unknown"
    - "requested capability is not present in the current plan/panel"
    - "production mutation lacks approval, rollback or required dry-run evidence"
    - "path escapes workspace or remote root"
    - "undocumented KingHost private API is required"
    - "video-only evidence conflicts with current docs or live panel"
