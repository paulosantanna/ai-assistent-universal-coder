# MCP: dark-videos pipeline operator
# Reads the local API and may enqueue one pipeline run. It does not post, download, or store cookies.

mcp:
  id: dark-videos-pipeline
  name: Dark Videos Pipeline
  protocol: model-context-protocol
  version: "2025-10-09"

  transport:
    type: stdio
    command: node
    args:
      - "dark-videos-pipeline-mcp/index.mjs"

  capabilities:
    tools:
      - name: pipeline.status
        description: Read the active run and the latest run summary from the local dark-videos API.
        security: read-only
        input: {}
        output:
          type: object
        constraints:
          - session_cookie_from_environment_only: true
          - never_log_cookie_or_csrf: true

      - name: mining.board
        description: Read connector status and the latest ranking, including JEV heat.
        security: read-only
        input: {}
        output:
          type: object
        constraints:
          - session_cookie_from_environment_only: true
          - never_log_cookie_or_csrf: true

      - name: pipeline.start_run
        description: Enqueue the existing dark-videos pipeline. Does not call Instagram, TikTok, or YouTube.
        security: controlled
        input:
          target_count:
            type: integer
          dry_run:
            type: boolean
        output:
          type: object
        constraints:
          - approval_required: true
          - session_cookie_from_environment_only: true
          - csrf_token_from_environment_only: true
          - never_log_cookie_or_csrf: true
          - no_direct_network_publish: true

rules:
  write_allowed: false
  delete_allowed: false
  secrets_runtime: false
  network: local-api-only
  production_mutation: enqueue-only

prompt_contract:
  purpose: Observe the dark-videos pipeline and enqueue the run the app already owns.
  forbidden:
    - Posting to Instagram, TikTok, or YouTube from this process
    - Downloading or deleting media
    - Printing session cookies, CSRF tokens, or API keys
